# omasushi omakase — https://github.com/polidog/omasushi
#
# Copy this directory, run `omasushi -f omasushi.yaml export` on a machine you
# like, add your dotfiles under files/ and Claude skills under skills/, push.

name: my-setup
description: What this setup is about, in one line.

# Build on other people's omakases: they are loaded underneath this file, so
# your entries win on conflicts, and `omasushi export` never records what they
# already declare. owner/repo[/part], a git URL, or a path (relative = sibling).
# use:
#   - polidog/omakase/kitty
#   - someone/nvim-setup

# Prefer feature-sized pieces others can mix and match? Write them under parts:
# instead of the sections below — `omasushi use you/repo` takes all of them,
# `omasushi use you/repo/kitty` just one. Paths stay relative to this directory,
# so files/ below serves every part. A part with an empty value instead lives in
# a directory of its own, with its own omasushi.yaml and its own files/.
# parts:
#   kitty:
#     files: { files/kitty.conf: ~/.config/kitty/kitty.conf }
#   nvim:

packages:
  pacman: []            # official repos — written by hand, e.g. [tmux, ripgrep]
  aur: []               # filled by `omasushi export` from pacman -Qqm

omarchy:
  # font: "UDEV Gothic NF"        # `omarchy font list` for names; ship the font package above
  # defaults:
  #   agent: claude               # pi|omp|opencode|claude|codex|grok|gemini|copilot|crush
  #   browser: chrome             # chromium|chrome|brave|brave-origin|edge|firefox|zen
  #   editor: nvim                # code|cursor|zed|sublime_text|helix|vim|emacs|nvim
  #   terminal: kitty             # foot|ghostty|kitty
  plugins: []
  # - url: https://github.com/crmne/omarchy-hyprmoncfg.git
  #   enable: true

herdr:
  plugins: []
  # - source: owner/repo          # owner/repo[/subdir], optional ref:

agent:                  # linked for the Omarchy default agent (omarchy.defaults.agent above,
                        # else this machine's): claude -> ~/.claude, codex -> ~/.codex, ...
  skills: skills        # skills/<name>/SKILL.md -> ~/.claude/skills/<name> | ~/.codex/skills/<name>
  commands: commands    # commands/<name>.md     -> ~/.claude/commands/<name>.md | ~/.codex/prompts/<name>.md
# claude:               # the same, but always for Claude Code regardless of the default agent
#   skills: skills
#   commands: commands

files: {}
  # files/kitty.conf: ~/.config/kitty/kitty.conf
  # files/nvim: ~/.config/nvim   # directories work too

hosts: {}
  # laptop:
  #   packages: { aur: [brightnessctl] }
  #   files: { files/hypr/monitors-laptop.conf: ~/.config/hypr/monitors.conf }
