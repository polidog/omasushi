# This repository is itself an omakase, split into feature-sized parts.
#   omasushi use polidog/omasushi          # everything below
#   omasushi use polidog/omasushi/herdr    # just the herdr keybindings
name: omasushi
description: The omasushi CLI's own skill, bar widget and herdr config.

parts:
  - plugin   # Omarchy bar widget
  - claude   # Claude Code skill for driving omasushi
  - herdr    # tmux-style herdr keybindings + plugins
