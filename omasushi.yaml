# This repository is itself an omakase: `omasushi use polidog/omasushi` installs
# the omasushi Claude Code skill and the bar widget.
name: omasushi
description: The omasushi CLI's own skill and bar widget.

omarchy:
  plugins:
    - url: https://github.com/polidog/omasushi.git
      enable: true

claude:
  skills: skills

herdr:
  plugins:
    - source: szrenwei/herdr-agent-metrics    # [[keys.command]] herdr-agent-metrics.refresh
    - source: polidog/herdr-gh-issue-label    # $issue sidebar row

files:
  files/herdr/config.toml: ~/.config/herdr/config.toml   # tmux-style keybindings (prefix ctrl+b)
