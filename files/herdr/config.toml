# Herdr config
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

# 初回起動時のオンボーディングは出さない
onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#6E6A64"

[terminal]
# split / new tab / new workspace は元のペインの cwd を引き継ぐ
new_cwd = "follow"

[keys]
prefix = "ctrl+b"   # herdr デフォルト

# Config and help
help = "prefix+?"
reload_config = "prefix+shift+r"   # prefix+q は detach に譲ったのでデフォルトへ
# detach: tmux に合わせて prefix+d（従来の prefix+q も残す）
detach = ["prefix+d", "prefix+q"]

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+minus", "alt+enter"]        # prefix+h は focus_pane_left に譲った
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
rename_pane = "prefix+shift+o"

# ペイン移動: デフォルトの prefix+h/j/k/l に加えて Ctrl+Alt+矢印
focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

# ペインリサイズ（herdr 0.8.2 はネイティブ設定があるので CLI 経由は不要）
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+shift+x"       # prefix+k は focus_pane_up に譲った
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left", "alt+h"]
next_tab = ["prefix+n", "alt+right", "alt+l"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"   # prefix+shift+r は reload_config に譲った
close_workspace = "prefix+shift+k"
switch_workspace = "alt+shift+1..9"
previous_workspace = ["alt+k", "alt+up"]
next_workspace = ["alt+j", "alt+down"]

# herdr-agent-metrics プラグインのサイドバーメトリクスを手動更新
[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "herdr-agent-metrics.refresh"
description = "Agent Metrics: refresh sidebar metrics"

[ui]
accent = "#6E6A64"
show_agent_labels_on_pane_borders = true

# tmux 風: ペイン間は 1 本線のみ、外枠・スクロールバーなし
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false

confirm_close = false
prompt_new_tab_name = false
mouse_capture = true

tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
window_title = "{hostname}: {workspace}"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$issue"],   # polidog.gh-issue-label: ブランチに対応する issue 番号とタイトル
]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "$usage"],
  ["$context", "$limit"],
]

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false
