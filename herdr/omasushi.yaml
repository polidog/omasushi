# Herdr: tmux-style keybindings (prefix ctrl+b) and a couple of plugins.
name: omasushi/herdr
description: tmux-style herdr keybindings, agent metrics and GitHub issue label plugins.

herdr:
  plugins:
    - source: szrenwei/herdr-agent-metrics    # [[keys.command]] herdr-agent-metrics.refresh
    - source: polidog/herdr-gh-issue-label    # $issue sidebar row

files:
  files/config.toml: ~/.config/herdr/config.toml
